[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[build.processing.html]
  pretty_urls = true

[[plugins]]
  package = "@netlify/plugin-sitemap"

  [plugins.inputs]
    buildDir = "."
    prettyURLs = true
    changeFreq = "weekly"
    priority = "0.8"
    exclude = [
      "./admin/**",
      "./privacy-policy.html",
      "./404.html",
      "./content/**"
    ]

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/post.html?slug=:slug"
  status = 200

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404